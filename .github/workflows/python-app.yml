name: Python Application CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build, Lint, and Test Gate
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8 pip-audit

    - name: Run Dependency Security Audit
      run: |
        pip-audit

    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 pokedex tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # Enforce code style complexity constraints and reject merge on failure
        flake8 pokedex tests --count --max-complexity=10 --max-line-length=127 --statistics

    - name: Initialize Isolated Database Fixture
      run: |
        if [ -f init_db.py ]; then
          python init_db.py
        fi

    - name: Test with pytest and Enforce 70% Coverage Gate
      run: |
        pytest --cov=pokedex --cov-report=xml:cov.xml --cov-fail-under=70
