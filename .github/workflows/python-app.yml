name: Python Application CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov flake8

    - name: Lint with flake8
      run: |
        flake8 pokedex tests --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 pokedex tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest and enforce 70% coverage gate
      run: |
        pytest --cov=pokedex --cov-fail-under=70
